image:
  repository: caiocfer/gpu-exporter
  tag: v4
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  port: 9835
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9835"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

nvidia:
  enabled: true
  # Set if cluster has nvidia runtime class configured
  runtimeClassName: ""
  # Optional: explicit path to libnvidia-ml.so (bypasses LD_LIBRARY_PATH)
  nvmlLibPath: ""
  # Individual file mounts — no directory shadowing, avoids glibc conflicts
  libraryFiles:
    - hostPath: /usr/lib/libnvidia-ml.so
      mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so
    - hostPath: /usr/lib/libnvidia-ml.so.1
      mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
    - hostPath: /usr/bin/nvidia-smi
      mountPath: /usr/bin/nvidia-smi
  devices:
    - /dev/nvidiactl
    - /dev/nvidia0
    - /dev/nvidia-uvm
    - /dev/nvidia-modeset
    - /dev/nvidia-uvm-tools

extraArgs: {}
