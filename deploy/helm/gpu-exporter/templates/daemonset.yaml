apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "gpu-exporter.fullname" . }}
  labels:
    {{- include "gpu-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gpu-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu-exporter.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.nvidia.runtimeClassName }}
      runtimeClassName: {{ .Values.nvidia.runtimeClassName | quote }}
      {{- end }}
      hostPID: true
      serviceAccountName: {{ include "gpu-exporter.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gpu-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.nvidia.enabled }}
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/lib:/usr/lib/x86_64-linux-gnu
            {{- if .Values.nvidia.nvmlLibPath }}
            - name: NVML_LIB_PATH
              value: {{ .Values.nvidia.nvmlLibPath }}
            {{- end }}
          {{- end }}
          args:
            - --addr=:{{ .Values.service.port }}
            {{- range $key, $value := .Values.extraArgs }}
            - --{{ $key }}={{ $value }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.nvidia.enabled }}
          volumeMounts:
            {{- range .Values.nvidia.libraryFiles }}
            - name: lib-{{ base .hostPath | replace "." "-" }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- range .Values.nvidia.devices }}
            - name: dev-{{ base . }}
              mountPath: {{ . }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            privileged: true
      {{- if .Values.nvidia.enabled }}
      volumes:
        {{- range .Values.nvidia.libraryFiles }}
        - name: lib-{{ base .hostPath | replace "." "-" }}
          hostPath:
            path: {{ .hostPath }}
        {{- end }}
        {{- range .Values.nvidia.devices }}
        - name: dev-{{ base . }}
          hostPath:
            path: {{ . }}
        {{- end }}
      {{- end }}
