apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-exporter.fullname" . }}
  labels:
    {{- include "gpu-exporter.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gpu-exporter.selectorLabels" . | nindent 4 }}
